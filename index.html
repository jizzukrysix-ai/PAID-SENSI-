<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VaultDrop - Multi-File Secure Downloader</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Official Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #1a0b2e 50%, #2a0845 100%);
            --glass-card: rgba(30, 15, 55, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-purple: #a855f7;
            --accent-glow: #c084fc;
            --text-primary: #ffffff;
            --text-secondary: #c0b3d8;
            --success-color: #34d399;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; overflow-x: hidden;
        }

        .container {
            width: 100%; max-width: 440px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .header {
            text-align: center; background: var(--glass-card);
            backdrop-filter: blur(16px); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .header h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #e879f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        /* File Slot Cards */
        .slots-grid { display: flex; flex-direction: column; gap: 12px; }

        .file-card {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 14px;
            display: flex; align-items: center; gap: 14px;
            cursor: pointer; transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .file-card:hover {
            border-color: var(--accent-glow);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(168, 85, 247, 0.25);
        }

        .thumb {
            width: 60px; height: 60px; border-radius: 14px;
            object-fit: cover; background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border); flex-shrink: 0;
        }

        .info { flex: 1; overflow: hidden; text-align: left; }
        .info h3 { font-size: 15px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info p { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

        .action-badge {
            background: rgba(168, 85, 247, 0.2); border: 1px solid var(--accent-purple);
            color: var(--accent-glow); padding: 8px 12px; border-radius: 10px;
            font-size: 12px; font-weight: bold; flex-shrink: 0;
        }

        /* MODAL POPUP FOR VERIFICATION */
        #modalOverlay {
            position: fixed; inset: 0; background: rgba(10, 5, 20, 0.85);
            backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }

        .modal-content {
            width: 100%; max-width: 380px; background: rgba(35, 18, 65, 0.95);
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px;
            text-align: center; box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
            position: relative; animation: popUp 0.3s ease;
        }
        @keyframes popUp {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-thumb { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; margin-bottom: 12px; border: 1px solid var(--glass-border); }
        .modal-content h3 { font-size: 16px; margin-bottom: 4px; }
        .modal-content p { font-size: 12px; color: var(--text-secondary); margin-bottom: 20px; }

        /* Steps Indicator inside Modal */
        .modal-steps { display: flex; justify-content: space-between; margin-bottom: 20px; gap: 6px; }
        .m-step { flex: 1; background: rgba(255,255,255,0.08); border-radius: 8px; padding: 6px; font-size: 11px; color: var(--text-secondary); border: 1px solid transparent; }
        .m-step.active { background: rgba(168,85,247,0.25); border-color: var(--accent-purple); color: #fff; font-weight: bold; }
        .m-step.completed { background: rgba(52,211,153,0.2); border-color: var(--success-color); color: var(--success-color); }

        .modal-btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #a855f7, #7e22ce); color: white;
            font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        .modal-btn.download { background: linear-gradient(135deg, #10b981, #059669); }
        .modal-btn:disabled { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); box-shadow: none; }

        .close-modal {
            position: absolute; top: 14px; right: 16px; background: none; border: none;
            color: #fff; font-size: 18px; cursor: pointer; opacity: 0.7;
        }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 10, 35, 0.95); border: 1px solid var(--glass-border);
            color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>⚡ VaultDrop Secure Files</h1>
            <p>Select any file below to start verification & download</p>
        </div>

        <div class="slots-grid" id="slotsContainer"></div>
    </div>

    <!-- MODAL POPUP CONTAINER -->
    <div id="modalOverlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <img id="modalThumb" class="modal-thumb" src="" alt="thumb">
            <h3 id="modalTitle">File Name</h3>
            <p id="modalSize">Size: 0 MB</p>

            <div class="modal-steps">
                <div class="m-step active" id="mStep1">Ad 1</div>
                <div class="m-step" id="mStep2">Ad 2</div>
                <div class="m-step" id="mStep3">Ad 3</div>
            </div>

            <button class="modal-btn" id="modalActionBtn" onclick="handleModalStep()">Watch Ad #1</button>
            <p id="modalStatus" style="font-size: 11px; color: var(--accent-glow); margin-top: 10px;">Complete 3 steps to unlock file</p>
        </div>
    </div>

    <div id="toast">Notice</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        let activeSlots = JSON.parse(localStorage.getItem('vault_slots') || '[]');
        let currentActiveIndex = null;
        let fileProgress = {};

        // Adsgram Controller Initialization
        // Replace "YOUR_ADSGRAM_BLOCK_ID" with your actual Adsgram block ID string
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID", debug: false }) : null;

        function renderSlots() {
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '';

            if (activeSlots.length === 0) {
                container.innerHTML = '<div class="header"><p>No file slots available. Please configure via Admin Panel.</p></div>';
                return;
            }

            activeSlots.forEach((slot, index) => {
                if (!fileProgress[index]) fileProgress[index] = 1;

                let badgeText = "🔒 Unlock";
                if (fileProgress[index] === 2) badgeText = "⚡ Ad 2 Ready";
                if (fileProgress[index] === 3) badgeText = "⏳ Final Step";
                if (fileProgress[index] === 4) badgeText = "📥 Download";

                const defaultThumb = 'https://via.placeholder.com/100/9333ea/ffffff?text=FILE';
                const card = document.createElement('div');
                card.className = 'file-card';
                card.onclick = () => openModal(index);
                card.innerHTML = `
                    <img class="thumb" src="${slot.thumb || defaultThumb}" alt="thumb" onerror="this.src='${defaultThumb}'">
                    <div class="info">
                        <h3>${slot.name || 'Unnamed File'}</h3>
                        <p>${slot.size || 'N/A'} • Tap to verify</p>
                    </div>
                    <div class="action-badge">${badgeText}</div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(index) {
            currentActiveIndex = index;
            const slot = activeSlots[index];
            const defaultThumb = 'https://via.placeholder.com/100/9333ea/ffffff?text=FILE';

            document.getElementById('modalThumb').src = slot.thumb || defaultThumb;
            document.getElementById('modalTitle').innerText = slot.name;
            document.getElementById('modalSize').innerText = `Size: ${slot.size || 'N/A'}`;

            updateModalUI();
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function updateModalUI() {
            const step = fileProgress[currentActiveIndex];
            const s1 = document.getElementById('mStep1');
            const s2 = document.getElementById('mStep2');
            const s3 = document.getElementById('mStep3');
            const btn = document.getElementById('modalActionBtn');
            const status = document.getElementById('modalStatus');

            s1.className = "m-step"; s2.className = "m-step"; s3.className = "m-step";
            btn.className = "modal-btn";
            btn.disabled = false;

            if (step === 1) {
                s1.classList.add('active');
                btn.innerText = "Watch Verification Ad #1";
                status.innerText = "Step 1: Watch first ad verification";
            } else if (step === 2) {
                s1.classList.add('completed');
                s2.classList.add('active');
                btn.innerText = "Watch Verification Ad #2";
                status.innerText = "Step 2: Watch second ad check";
            } else if (step === 3) {
                s1.classList.add('completed');
                s2.classList.add('completed');
                s3.classList.add('active');
                btn.innerText = "Final Pass (15s Timer)";
                status.innerText = "Step 3: Final verification pass";
            } else if (step === 4) {
                s1.classList.add('completed'); s2.classList.add('completed'); s3.classList.add('completed');
                btn.classList.add('download');
                btn.innerText = "🚀 Get File Now";
                status.innerText = "File successfully unlocked!";
            }
        }

        async function handleModalStep() {
            const step = fileProgress[currentActiveIndex];
            const btn = document.getElementById('modalActionBtn');

            if (step === 1 || step === 2) {
                btn.disabled = true;
                if (!adController) {
                    advanceStep();
                    return;
                }

                try {
                    // Official Adsgram show method
                    const result = await adController.show();
                    advanceStep();
                } catch (err) {
                    console.error("Ad error or skipped:", err);
                    showToast("❌ Ad skipped or unavailable");
                    btn.disabled = false;
                }
            } else if (step === 3) {
                btn.disabled = true;
                let timer = 15;
                let interval = setInterval(() => {
                    timer--;
                    document.getElementById('modalStatus').innerText = `⏳ Finalizing link (${timer}s)...`;
                    if (timer <= 0) {
                        clearInterval(interval);
                        advanceStep();
                    }
                }, 1000);
            } else if (step === 4) {
                const link = activeSlots[currentActiveIndex].link;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                tg.openLink(link);
            }
        }

        function advanceStep() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            fileProgress[currentActiveIndex]++;
            updateModalUI();
            renderSlots();
            showToast("✅ Step Verified Successfully!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }

        renderSlots();
    </script>
</body>
</html>
