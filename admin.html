<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VaultDrop - Secure Admin Manager</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #1a0b2e 50%, #2a0845 100%);
            --glass-card: rgba(30, 15, 55, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-purple: #a855f7;
            --accent-glow: #c084fc;
            --text-primary: #ffffff;
            --text-secondary: #c0b3d8;
            --success-color: #34d399;
            --danger-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; overflow-x: hidden;
        }

        .container {
            width: 100%; max-width: 480px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .glass-box {
            background: var(--glass-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(90deg, #ffffff, #e879f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

        #loginSection { display: block; margin-top: 40px; }
        #adminDashboard { display: none; }

        .input-group { margin-top: 14px; text-align: left; }
        .input-group label { font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 4px; }

        input {
            width: 100%; padding: 12px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border);
            color: white; font-size: 14px; outline: none; transition: border 0.2s;
        }
        input:focus { border-color: var(--accent-glow); }

        .btn {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #a855f7, #7e22ce); color: white;
            font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 16px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35); transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.85; }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.35); }

        .slots-manager-list {
            display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; margin-top: 12px; padding-right: 4px;
        }
        .slot-manage-card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; text-align: left;
        }
        .slot-manage-info h4 { font-size: 13px; color: #fff; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .slot-manage-info p { font-size: 10px; color: var(--text-secondary); }
        
        .slot-actions { display: flex; gap: 6px; }
        .icon-btn {
            background: rgba(255, 255, 255, 0.1); border: none; color: white;
            padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;
        }
        .icon-btn.del { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }

        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(20, 10, 35, 0.95); border: 1px solid var(--glass-border);
            color: white; padding: 10px 20px; border-radius: 20px; font-size: 12px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- LOGIN SECTION -->
        <div class="glass-box" id="loginSection">
            <h1>🔐 Admin Panel Login</h1>
            <p>Enter your master password to manage file slots</p>
            <div class="input-group">
                <label>Master Password</label>
                <input type="password" id="passwordInput" placeholder="Enter password...">
            </div>
            <button class="btn" onclick="handleLogin()">Login to Panel</button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="adminDashboard">
            <div class="glass-box" style="margin-bottom: 16px;">
                <h1>⚡ VaultDrop Manager</h1>
                <p>Cloud-synced via Firebase Realtime Database</p>
                <button class="btn btn-danger" style="margin-top: 12px; padding: 8px; font-size: 12px;" onclick="handleLogout()">🔒 Lock Panel</button>
            </div>

            <!-- Add / Edit Form -->
            <div class="glass-box">
                <h3 id="formTitle" style="font-size: 15px; margin-bottom: 10px; color: var(--accent-glow);">Add New File Slot</h3>
                <input type="hidden" id="editSlotKey" value="">
                
                <div class="input-group">
                    <label>File Display Name</label>
                    <input type="text" id="fileName" placeholder="e.g. Android_Toolkit_v2.zip">
                </div>
                <div class="input-group">
                    <label>Thumbnail Image URL</label>
                    <input type="text" id="fileThumb" placeholder="https://example.com/image.jpg">
                </div>
                <div class="input-group">
                    <label>File Size</label>
                    <input type="text" id="fileSize" placeholder="e.g. 45.2 MB">
                </div>
                <div class="input-group">
                    <label>Target Download Link (Google Drive / Direct URL)</label>
                    <input type="text" id="fileLink" placeholder="https://drive.google.com/...">
                </div>

                <button class="btn" id="saveBtn" onclick="saveSlotData()">💾 Save File Slot</button>
            </div>

            <!-- Active Slots List -->
            <div class="glass-box" style="margin-top: 16px;">
                <h3 style="font-size: 15px; margin-bottom: 8px;">Cloud Slots Directory</h3>
                <div class="slots-manager-list" id="managerSlotsList"></div>
            </div>
        </div>
    </div>

    <div id="toast">Notice</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        // Firebase Initialization
        const firebaseConfig = {
          apiKey: "AIzaSyCQJJePmoPx7jHnc2d_t-BvgrQLCJhKWAg",
          authDomain: "vaultdrop-270e5.firebaseapp.com",
          databaseURL: "https://vaultdrop-270e5-default-rtdb.firebaseio.com",
          projectId: "vaultdrop-270e5",
          storageBucket: "vaultdrop-270e5.firebasestorage.app",
          messagingSenderId: "640140645418",
          appId: "1:640140645418:web:43d9a8b7ceca58e67ddf53"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MASTER_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
        let cachedSlots = {};

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function handleLogin() {
            const pass = document.getElementById('passwordInput').value;
            const hashed = await sha256(pass);

            if (hashed === MASTER_HASH) {
                localStorage.setItem('vault_admin_auth', 'true');
                showDashboard();
                showToast("🔓 Welcome back, Admin!");
            } else {
                showToast("❌ Incorrect Password");
            }
        }

        function handleLogout() {
            localStorage.removeItem('vault_admin_auth');
            document.getElementById('adminDashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('passwordInput').value = '';
            showToast("🔒 Panel locked successfully");
        }

        function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            fetchSlotsRealtime();
        }

        if (localStorage.getItem('vault_admin_auth') === 'true') {
            showDashboard();
        }

        function fetchSlotsRealtime() {
            db.ref('vault_slots').on('value', (snapshot) => {
                cachedSlots = snapshot.val() || {};
                renderManagerSlots();
            });
        }

        function renderManagerSlots() {
            const container = document.getElementById('managerSlotsList');
            container.innerHTML = '';
            const keys = Object.keys(cachedSlots);

            if (keys.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:#999; padding: 10px;">No cloud slots configured yet.</p>';
                return;
            }

            keys.forEach((key, index) => {
                const slot = cachedSlots[key];
                const card = document.createElement('div');
                card.className = 'slot-manage-card';
                card.innerHTML = `
                    <div class="slot-manage-info">
                        <h4>${index + 1}. ${slot.name}</h4>
                        <p>${slot.size} • <a href="${slot.link}" target="_blank" style="color:var(--accent-glow)">Test Link</a></p>
                    </div>
                    <div class="slot-actions">
                        <button class="icon-btn" onclick="editSlot('${key}')">Edit</button>
                        <button class="icon-btn del" onclick="deleteSlot('${key}')">Del</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function saveSlotData() {
            const name = document.getElementById('fileName').value.trim();
            const thumb = document.getElementById('fileThumb').value.trim();
            const size = document.getElementById('fileSize').value.trim();
            const link = document.getElementById('fileLink').value.trim();
            const editKey = document.getElementById('editSlotKey').value;

            if (!name || !link) {
                showToast("⚠️ File Name and Link are required!");
                return;
            }

            const slotData = {
                name,
                thumb: thumb || 'https://via.placeholder.com/100/9333ea/ffffff?text=FILE',
                size: size || 'N/A',
                link
            };

            if (editKey) {
                db.ref('vault_slots/' + editKey).set(slotData, (error) => {
                    if (!error) showToast("✅ Slot updated in cloud!");
                });
            } else {
                if (Object.keys(cachedSlots).length >= 10) {
                    showToast("⚠️ Maximum 10 slots allowed!");
                    return;
                }
                db.ref('vault_slots').push(slotData, (error) => {
                    if (!error) showToast("🎉 New slot saved to cloud!");
                });
            }

            resetForm();
        }

        function editSlot(key) {
            const slot = cachedSlots[key];
            document.getElementById('fileName').value = slot.name;
            document.getElementById('fileThumb').value = slot.thumb;
            document.getElementById('fileSize').value = slot.size;
            document.getElementById('fileLink').value = slot.link;
            document.getElementById('editSlotKey').value = key;
            document.getElementById('formTitle').innerText = `Edit Slot`;
            document.getElementById('saveBtn').innerText = "💾 Update Slot";
        }

        function deleteSlot(key) {
            db.ref('vault_slots/' + key).remove((error) => {
                if (!error) {
                    resetForm();
                    showToast("🗑️ Slot removed from cloud.");
                }
            });
        }

        function resetForm() {
            document.getElementById('fileName').value = '';
            document.getElementById('fileThumb').value = '';
            document.getElementById('fileSize').value = '';
            document.getElementById('fileLink').value = '';
            document.getElementById('editSlotKey').value = '';
            document.getElementById('formTitle').innerText = 'Add New File Slot';
            document.getElementById('saveBtn').innerText = '💾 Save File Slot';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2500);
        }
    </script>
</body>
</html>
